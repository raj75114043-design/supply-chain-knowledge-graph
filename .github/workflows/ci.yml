name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-24.04
    env: {LLM_PROVIDER: none, API_KEYS: test-key}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Source data is reproducible from the generator
        run: python -m sckg.data.generator && git diff --exit-code data/
      - name: Tests
        run: pytest -q
      - name: Quality gate (extraction, entity resolution, analytics agreement, GraphRAG QA)
        run: python -m sckg.eval.run --gate
      - uses: actions/upload-artifact@v7
        with: {name: eval-report, path: reports/eval.json}

  integration-neo4j:
    runs-on: ubuntu-24.04
    services:
      neo4j:
        image: neo4j:5.20-community
        env: {NEO4J_AUTH: neo4j/sckg-password}
        ports: ["7687:7687"]
        options: --health-cmd "wget -qO- http://localhost:7474 || exit 1" --health-interval 10s --health-retries 20
    env: {LLM_PROVIDER: none, NEO4J_URI: "bolt://localhost:7687", NEO4J_PASSWORD: sckg-password}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Load graph into Neo4j and compare Cypher impact queries with Python analytics
        run: python -m sckg.cli neo4j-check

  docker:
    needs: [quality, integration-neo4j]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
