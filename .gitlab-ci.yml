stages: [quality, integration]
default:
  image: python:3.11-slim
  cache: {key: pip, paths: [.cache/pip]}
  before_script: [pip install -r requirements-dev.txt]
variables: {PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip", LLM_PROVIDER: none, API_KEYS: test-key}
quality:
  stage: quality
  script: [ruff check ., pytest -q, python -m sckg.eval.run --gate]
  artifacts: {paths: [reports/eval.json], expire_in: 30 days}
integration-neo4j:
  stage: integration
  services: [{name: "neo4j:5.20-community", alias: neo4j}]
  variables: {NEO4J_AUTH: neo4j/sckg-password, NEO4J_URI: "bolt://neo4j:7687", NEO4J_PASSWORD: sckg-password}
  script: [sleep 30, python -m sckg.cli neo4j-check]
