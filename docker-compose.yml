# Neo4j mirror + API + console
services:
  neo4j:
    image: neo4j:5.20-community
    environment: {NEO4J_AUTH: neo4j/sckg-password}
    ports: ["7474:7474", "7687:7687"]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"], interval: 10s, retries: 20}
  load:
    build: .
    env_file: .env
    command: ["python", "-m", "sckg.cli", "neo4j-check"]
    depends_on: {neo4j: {condition: service_healthy}}
    restart: "no"
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
  console:
    build: .
    env_file: .env
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
